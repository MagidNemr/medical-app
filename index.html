<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الفنية لبدائل الأدوية</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --main-gradient: linear-gradient(135deg, #004d40, #00796b);
            --bg-accent: #f4f7f6;
            --surface: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --primary: #00897b;
            --primary-light: #e0f2f1;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-accent); margin: 0; padding: 0; color: var(--text-dark); }
        .app-bar { background: var(--main-gradient); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 10px 25px rgba(0, 77, 64, 0.15); }
        .app-bar h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .app-bar p { margin: 6px 0 0 0; opacity: 0.85; font-size: 13px; }
        .wrapper { max-width: 480px; margin: -25px auto 40px auto; padding: 0 16px; box-sizing: border-box; }
        .search-box-wrapper { background: var(--surface); padding: 6px 10px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); display: flex; align-items: center; border: 2px solid #e2e8f0; }
        .input-field { flex: 1; border: none; padding: 12px 15px; font-size: 16px; outline: none; background: transparent; text-align: right; font-weight: bold; font-family: 'Cairo'; }
        
        .results-list { margin-top: 25px; display: flex; flex-direction: column; gap: 20px; }
        .display-card { background: var(--surface); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); border: 1px solid #e2e8f0; text-align: right; }
        .card-header-div { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 18px; }
        .drug-title { font-size: 20px; font-weight: 700; color: #004d40; }
        .price-badge { background: var(--primary-light); color: #004d40; font-weight: 700; padding: 6px 14px; border-radius: 50px; font-size: 14px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; background: #fafafa; padding: 12px; border-radius: 12px; border: 1px solid #f0f0f0; }
        .info-row { font-size: 14px; }
        .lbl { font-weight: 600; color: var(--text-muted); display: block; font-size: 12px; margin-bottom: 2px; }
        .val { font-weight: 700; color: var(--text-dark); }
        .badge-form { background: #efebe9; color: #4e342e; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .alternatives-container { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px; margin-top: 18px; }
        .alt-header-title { font-weight: 700; color: #0f172a; margin-bottom: 12px; font-size: 14px; }
        .alt-bullet-list { margin: 0; padding-right: 20px; color: #334155; font-size: 14px; }
        .alt-bullet-list li { margin-bottom: 8px; color: #004d40; font-weight: 600; }
        .no-results { background: var(--surface); border-radius: 20px; padding: 20px; text-align: center; color: var(--text-muted); font-weight: bold; border: 1px solid #e2e8f0; display: none; }
        .safety-disclaimer-div { font-size: 11px; color: #ef4444; text-align: center; margin-top: 35px; font-weight: 600; line-height: 1.6; }
        .loader-status { text-align: center; font-size: 12px; color: var(--primary); font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-bar">
        <h1>المكتبة الفنية لبدائل الأدوية 💊</h1>
        <p>محرك البحث الذكي المتعدد المحدث تلقائياً بالسوق السحابي</p>
    </div>

    <div class="wrapper">
        <div class="search-box-wrapper">
            <input type="text" id="searchInput" class="input-field" placeholder="ابحث باسم الدواء أو المادة الفعالة (أوميز، بروفين، شراب)..." oninput="executeLiveSearch()">
        </div>
        <div id="loadStatus" class="loader-status">جاري مزامنة قاعدة البيانات الحية...</div>

        <div id="resultsContainer" class="results-list"></div>
        <div id="noResultsCard" class="no-results">عذراً، لم يتم العثور على أدوية مطابقة لبحثك.</div>

        <div class="safety-disclaimer-div">⚠️ إخلاء مسؤولية طبي: هذا التطبيق مرجع استرشادي تقني فقط. يرجى مراجعة واستشارة الطبيب أو الصيدلي المختص.</div>
    </div>

    <script>
        // رابط سحب البيانات المباشر والآمن من مستند جوجل شيت يحتوي على آلاف الأدوية
        const cloudSheetURL = 'https://google.com';
        let cloudMedDatabase = [];

        // دالة الاتصال التلقائي بالسحابة
        async function fetchCloudData() {
            try {
                const response = await fetch(cloudSheetURL);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -3));
                const rows = json.table.rows;
                
                cloudMedDatabase = rows.map(row => ({
                    nameAr: row.c[0] ? String(row.c[0].v) : '',
                    nameEn: row.c[1] ? String(row.c[1].v) : '',
                    activeAr: row.c[2] ? String(row.c[2].v) : '',
                    strength: row.c[3] ? String(row.c[3].v) : '',
                    form: row.c[4] ? String(row.c[4].v) : '',
                    price: row.c[5] ? String(row.c[5].v) : '--',
                    alts: row.c[6] ? String(row.c[6].v).split('-') : []
                }));
                document.getElementById('loadStatus').innerText = "✅ تم تحديث كافة الأدوية بنجاح ومستعد للبحث";
                setTimeout(() => document.getElementById('loadStatus').style.display = 'none', 2000);
            } catch (error) {
                document.getElementById('loadStatus').innerText = "⚠️ يعمل بالنظام الاحتياطي للأدوية الأساسية";
                cloudMedDatabase = [
                    { nameAr: "كتالفام", nameEn: "cataflam", activeAr: "ديكلوفيناك البوتاسيوم", strength: "50 مجم", form: "أقراص", price: "75", alts: ["أوفلام", "فاست فلام"] },
                    { nameAr: "أوميز", nameEn: "omez", activeAr: "أوميبرازول", strength: "20 مجم", form: "كبسولات", price: "50", alts: ["أوميباك", "رايسك"] }
                ];
            }
        }

        fetchCloudData();

        function executeLiveSearch() {
            const rawInput = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            const noResults = document.getElementById('noResultsCard');
            
            container.innerHTML = "";
            noResults.style.display = 'none';

            if(!rawInput) return;

            const matchedItems = cloudMedDatabase.filter(item => 
                item.nameAr.toLowerCase().includes(rawInput) || 
                item.nameEn.toLowerCase().includes(rawInput) ||
                item.activeAr.toLowerCase().includes(rawInput) ||
                item.form.toLowerCase().includes(rawInput)
            );

            if(matchedItems.length > 0) {
                matchedItems.forEach(item => {
                    let altsHTML = "";
                    item.alts.forEach(alt => { altsHTML += `<li>${alt.trim()}</li>`; });

                    const cardHTML = `
                        <div class="display-card">
                            <div class="card-header-div">
                                <div class="drug-title">${item.nameAr}</div>
                                <div class="price-badge"><span>${item.price}</span> ج.م</div>
                            </div>
                            <div class="details-grid">
                                <div class="info-row"><span class="lbl">المادة الفعالة:</span><span class="val">${item.activeAr}</span></div>
                                <div class="info-row"><span class="lbl">الاسم بالإنجليزية:</span><span class="val" style="font-family:sans-serif;">${item.nameEn}</span></div>
                                <div class="info-row"><span class="lbl">التركيز:</span><span class="val" style="color:var(--primary);">${item.strength}</span></div>
                                <div class="info-row"><span class="lbl">الشكل الدوائي:</span><span class="badge-form">${item.form}</span></div>
                            </div>
                            <div class="alternatives-container">
                                <div class="alt-header-title">🔄 البدائل والمثائل المطابقة:</div>
                                <ul class="alt-bullet-list">${altsHTML}</ul>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });
            } else {
                noResults.style.display = 'block';
            }
        }
    </script>
</body>
</html>
